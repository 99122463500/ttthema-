<!DOCTYPE html>
<html>
<head>
  <title>TT Thema Attorneys</title>
  <style>
    body { margin:0; font-family: Georgia, serif; background: #0a1a2f; color: white; }
    header { background: black; padding: 20px; display:flex; justify-content:space-between; }
    nav a { color: gold; margin:0 15px; text-decoration:none; }
    .hero { text-align:center; padding:100px 20px; }
    .btn { background: gold; color: black; padding:15px 25px; border:none; cursor:pointer; }
    .form { padding:40px; text-align:center; }
    input, textarea { width:300px; margin:10px; padding:10px; }
    footer { text-align:center; padding:20px; background:black; margin-top:20px; }
  </style>
</head>
<body>

<header>
  <h2>TT Thema Attorneys</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h1>Justice. Integrity. Results.</h1>
  <p>Professional Legal Services You Can Trust</p>
</section>

<section class="form">
  <h2>Contact Us</h2>
  <input type="text" id="name" placeholder="Your Name"><br>
  <input type="email" id="email" placeholder="Your Email"><br>
  <textarea id="message" placeholder="Your Message"></textarea><br>
  <button class="btn" onclick="sendMessage()">Send</button>
</section>

<footer>
  &copy; 2026 TT Thema Attorneys
</footer>

<script>
function sendMessage() {
  fetch("https://ttthema-backend.onrender.com/contact", { // Use live Render backend URL
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      message: document.getElementById("message").value
    })
  })
  .then(res => res.text())
  .then(data => alert(data))
  .catch(err => alert("Failed to send message"));
}
</script>

</body>
</html>
